name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: npm run package

      - name: Inspect VSIX contents
        shell: bash
        run: |
          set -euo pipefail
          vsix=dist/vscode-macos-traffic-lights.vsix
          test -f "$vsix"
          unzip -tq "$vsix"

          expected=(
            "[Content_Types].xml"
            extension.vsixmanifest
            extension/package.json
            extension/compatibility.json
            extension/readme.md
            extension/changelog.md
            extension/LICENSE.txt
            extension/dist/extension.js
            extension/assets/macos-traffic-lights.css
            extension/assets/icon.png
            extension/docs/architecture.md
            extension/docs/compatibility.md
            extension/docs/manual-testing.md
            extension/docs/upstream-analysis.md
          )
          mapfile -t actual < <(unzip -Z1 "$vsix")

          if ! diff -u \
            <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort) \
            <(printf '%s\n' "${actual[@]}" | LC_ALL=C sort); then
            echo 'Packaged VSIX contents do not match the release allowlist.' >&2
            exit 1
          fi

          printf '%s\n' "${actual[@]}"

      - name: Upload packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: vscode-macos-traffic-lights-vsix
          path: dist/vscode-macos-traffic-lights.vsix
          if-no-files-found: error
