name: Upstream compatibility

on:
  workflow_dispatch:
    inputs:
      vscode_ref:
        description: VS Code branch, tag, or commit to verify
        required: true
        default: main
        type: string
  schedule:
    - cron: "17 6 1 * *"

permissions:
  contents: read

concurrency:
  group: upstream-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-upstream:
    name: Verify VS Code upstream contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VSCODE_REF: ${{ inputs.vscode_ref || 'main' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify upstream contracts
        run: node scripts/verify-upstream.mjs --ref "$VSCODE_REF"
